# Pagewise: scans the site after each successful deployment on Vercel.
#  - Production (default branch): full inventory and audit, stored in Pagewise, DESIGN.md refreshed.
#  - Preview (any other branch): compared with production, the review goes to the job summary and, when the
#    commit belongs to an open pull request, to one comment on it that is kept up to date.
# It checks out the repo to read its routes and loads the deployed pages. It never changes code or content.
#
# Two triggers, so it works whatever the Vercel project's Git settings are:
#  - deployment_status: sent by Vercel when "deployment_status Events" is on (Project › Settings › Git);
#  - status: the commit status Vercel writes on every commit ("Commit Status", on by default). It does not carry the
#    preview URL, hence preview-url below.
# When both arrive for the same commit, the concurrency group keeps a single scan.
name: Pagewise

on:
  deployment_status:
  status:
  workflow_dispatch:
    inputs:
      mode:
        description: auto or full
        default: full

permissions:
  contents: read
  pull-requests: write # only to comment the review on pull requests; remove it to keep reviews in the job summary

jobs:
  scan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success') ||
      (github.event_name == 'status' && github.event.state == 'success' && startsWith(github.event.context, 'Vercel') && !contains(github.event.description, 'Canceled'))
    concurrency:
      group: pagewise-${{ github.event.deployment.sha || github.event.sha || github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.event.sha || github.sha }}
          fetch-depth: 2
      - uses: Unmake-io/pagewise-action@main
        with:
          site-url: ${{ vars.PAGEWISE_SITE_URL }}
          preview-url: ${{ vars.PAGEWISE_PREVIEW_URL }} # e.g. https://myapp-git-{branch}-myteam.vercel.app
          mode: ${{ inputs.mode || 'auto' }}
          vercel-bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          api-url: ${{ vars.PAGEWISE_API_URL }}
          token: ${{ secrets.PAGEWISE_TOKEN }}

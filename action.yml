name: Pagewise scan
description: Inventory every page of a deployed Next.js site, audit SEO, accessibility and UI consistency, and keep a full-page capture of each page. Read-only.
branding:
  icon: layout
  color: blue
inputs:
  site-url:
    description: Deployed site to scan (for example the production domain, or the Vercel preview URL).
    required: true
  environment:
    description: Name of the deployment environment (Production, Preview…), stored with the report.
    required: false
    default: ''
  mode:
    description: '"auto" scans only the routes a commit touched when it is safe, "full" scans everything.'
    required: false
    default: auto
  samples-per-dynamic-route:
    description: How many pages to scan for each dynamic route ([slug] and the like).
    required: false
    default: '4'
  vercel-bypass-secret:
    description: Vercel "Protection Bypass for Automation" secret, only needed for protected preview deployments.
    required: false
    default: ''
  api-url:
    description: Pagewise API to send the report to. Leave empty to keep the report as a workflow artifact only.
    required: false
    default: ''
  token:
    description: Pagewise project token, used with api-url.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install the scanner
      shell: bash
      run: npm ci --prefix "${{ github.action_path }}" --omit=dev --no-audit --no-fund
    - name: Scan the site
      shell: bash
      env:
        PAGEWISE_SITE_URL: ${{ inputs.site-url }}
        PAGEWISE_ENVIRONMENT: ${{ inputs.environment }}
        PAGEWISE_MODE: ${{ inputs.mode }}
        PAGEWISE_SAMPLES: ${{ inputs.samples-per-dynamic-route }}
        PAGEWISE_REPO_DIR: ${{ github.workspace }}
        PAGEWISE_OUT: ${{ runner.temp }}/pagewise-report
        PAGEWISE_CHROME: /usr/bin/google-chrome
        VERCEL_BYPASS_SECRET: ${{ inputs.vercel-bypass-secret }}
        PAGEWISE_API_URL: ${{ inputs.api-url }}
        PAGEWISE_TOKEN: ${{ inputs.token }}
      run: node "${{ github.action_path }}/src/run.mjs"
    - name: Keep the report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pagewise-report
        path: ${{ runner.temp }}/pagewise-report
        retention-days: 14
        if-no-files-found: ignore

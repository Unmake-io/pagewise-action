name: Calque scan
description: Inventory every page of a deployed Next.js site, audit SEO, indexing, share previews, accessibility, performance and UI consistency, write DESIGN.md, and review preview deployments against production. Read-only on your code.
branding:
  icon: layout
  color: blue
inputs:
  site-url:
    description: Deployed site to scan (for example the production domain, or the Vercel preview URL).
    required: true
  environment:
    description: Name of the deployment environment (Production, Preview…), stored with the report.
    required: false
    default: ''
  mode:
    description: '"auto" scans only the routes a commit touched when it is safe, "full" scans everything.'
    required: false
    default: auto
  samples-per-dynamic-route:
    description: How many pages to scan for each dynamic route ([slug] and the like).
    required: false
    default: '4'
  kind:
    description: '"auto" decides from the deployment event (production, or a preview to review), or force "production" / "review".'
    required: false
    default: auto
  preview-url:
    description: 'Preview to review when the event does not carry its URL (Vercel commit statuses). Use {branch} for the branch, for example https://myapp-git-{branch}-myteam.vercel.app'
    required: false
    default: ''
  github-token:
    description: Token used to comment the review on the pull request (needs pull-requests write permission in the workflow).
    required: false
    default: ${{ github.token }}
  private-routes:
    description: Extra routes behind sign-in, comma separated (for example /workspace,/billing). /app, /dashboard, /account, /settings, /admin and the sign-in routes are already treated as private.
    required: false
    default: ''
  login-url:
    description: Sign-in page used with the test account to scan signed-in pages, on previews and staging only (for example /login).
    required: false
    default: ''
  test-email:
    description: Test account email (pass a secret). Never used on production.
    required: false
    default: ''
  test-password:
    description: Test account password (pass a secret). Never used on production.
    required: false
    default: ''
  vercel-bypass-secret:
    description: Vercel "Protection Bypass for Automation" secret, only needed for protected preview deployments.
    required: false
    default: ''
  api-url:
    description: Calque API to send the report to. Leave empty to keep the report as a workflow artifact only.
    required: false
    default: ''
  token:
    description: Calque project token, used with api-url.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install the scanner
      shell: bash
      run: npm ci --prefix "${{ github.action_path }}" --omit=dev --no-audit --no-fund
    - name: Scan the site
      shell: bash
      env:
        PAGEWISE_SITE_URL: ${{ inputs.site-url }}
        PAGEWISE_ENVIRONMENT: ${{ inputs.environment }}
        PAGEWISE_MODE: ${{ inputs.mode }}
        PAGEWISE_KIND: ${{ inputs.kind }}
        PAGEWISE_PRIVATE: ${{ inputs.private-routes }}
        PAGEWISE_LOGIN_URL: ${{ inputs.login-url }}
        PAGEWISE_TEST_EMAIL: ${{ inputs.test-email }}
        PAGEWISE_TEST_PASSWORD: ${{ inputs.test-password }}
        PAGEWISE_PREVIEW_URL: ${{ inputs.preview-url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PAGEWISE_SAMPLES: ${{ inputs.samples-per-dynamic-route }}
        PAGEWISE_REPO_DIR: ${{ github.workspace }}
        PAGEWISE_OUT: ${{ runner.temp }}/calque-report
        PAGEWISE_CHROME: /usr/bin/google-chrome
        VERCEL_BYPASS_SECRET: ${{ inputs.vercel-bypass-secret }}
        PAGEWISE_API_URL: ${{ inputs.api-url }}
        PAGEWISE_TOKEN: ${{ inputs.token }}
      run: node "${{ github.action_path }}/src/run.mjs"
    - name: Keep the report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: calque-report
        path: ${{ runner.temp }}/calque-report
        retention-days: 14
        if-no-files-found: ignore
